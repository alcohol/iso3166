---
name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  php-cs-fixer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: cs2pr, composer
      - run: composer --working-dir=tools/php-cs-fixer install
      - run: tools/php-cs-fixer/vendor/bin/php-cs-fixer fix --diff --dry-run --format=checkstyle | cs2pr

  phpstan:
    runs-on: ubuntu-latest
    name: phpstan
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: cs2pr, composer
      - run: composer validate --strict --no-check-lock
      - run: composer update --prefer-dist --no-interaction
      - run: vendor/bin/phpstan --error-format=checkstyle | cs2pr

  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.5', '8.4', '8.3', '8.2', '8.1', '8.0', '7.4']
    name: PHPUnit on PHP ${{ matrix.php }}
    env:
      # collect and upload coverage from a single matrix job only
      COVERAGE: ${{ matrix.php == '8.4' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: ${{ env.COVERAGE == 'true' && 'xdebug' || 'none' }}
      - run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"
      - run: composer update --prefer-dist --no-interaction
      - if: env.COVERAGE != 'true'
        run: vendor/bin/phpunit
      - if: env.COVERAGE == 'true'
        run: vendor/bin/phpunit --coverage-clover coverage.xml --coverage-text
      - if: env.COVERAGE == 'true'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ibiqlik/action-yamllint@v3
        with:
          format: github
